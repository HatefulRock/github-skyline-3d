name: update-screenshot

on:
  schedule:
    # once a day, 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - name: Fetch real contribution data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/fetch-data.mjs HatefulRock
      - run: npm run build
      - name: Install Playwright's chromium
        run: npx playwright install --with-deps chromium
      - name: Start preview server
        run: |
          npx vite preview --port 4173 --host &
          for i in $(seq 1 30); do
            curl -sf http://localhost:4173/ > /dev/null && break
            sleep 1
          done
      - name: Screenshot
        run: node scripts/screenshot.mjs singapore 4173
      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A public/contributions.json screenshot.png
          if git commit -m "Update screenshot + contribution data"; then
            git push
          fi
