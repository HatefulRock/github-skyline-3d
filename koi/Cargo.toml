[package]
name = "koi-sprite"
version = "0.1.0"
edition = "2024"
publish = false
description = "Draws the account's git-koi swimming in place, as a sprite sheet the 3D skyline moves around its pond."
license = "MIT"

[dependencies]
# git-koi by Anthony Yalong (MIT), at the commit scripts/koi.sh pins, with render-pose.patch applied.
# scripts/koi.sh clones and patches it here.
git-koi = { path = "vendor/git-koi" }
png = "0.18"
serde_json = "1"
